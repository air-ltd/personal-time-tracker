<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Declared rather than left to the browser's default probe. Without this the
      browser requests /favicon.ico at the origin root, which for a project site
      is outside the repository path and always 404s. Vite prefixes the base path
      at build time, so this resolves under /personal-time-tracker/.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Time Tracker</title>
    <!--
      Apply the theme before first paint (0002 TH4).

      IndexedDB cannot be read synchronously, so awaiting it would mean painting
      with the wrong theme and flashing. This reads a deliberately narrow
      localStorage mirror instead: a theme preference is not personal data, is
      trivially reconstructible, and loses nothing if dropped.

      It remains the *only* copy. The storage layer has landed (Phase 2A), so the
      alternative this comment used to promise is now available and has not been taken:
      IndexedDB cannot be read synchronously, and writing the preference twice would mean
      two sources that can disagree. Noted here because the durable copy is the natural
      next step and the reason for stopping has not changed.

      Kept in sync with src/app/theme.ts — if the key or logic changes there,
      change it here too.
    -->
    <script>
      ;(function () {
        try {
          var KEY = 'tt:theme'
          var stored = window.localStorage.getItem(KEY)
          var pref =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (error) {
          // Private browsing can throw on localStorage access. A wrong theme is
          // cosmetic, so fall back rather than failing to render.
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
