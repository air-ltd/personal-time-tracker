<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Time Tracker">
  <!--
    Favicon lives in public/ so Vite copies it verbatim and prefixes the base
    path, giving https://air-ltd.github.io/personal-time-tracker/favicon.svg.

    Declaring it in index.html also stops the browser's implicit request to
    /favicon.ico at the origin root, which for a project site is outside the
    repository path and always 404s.
  -->
  <rect width="32" height="32" rx="7" fill="#1f5fbf" />
  <circle cx="16" cy="16" r="8.5" fill="none" stroke="#ffffff" stroke-width="2.4" />
  <path
    d="M16 10.6V16l3.7 2.5"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
