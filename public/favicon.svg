<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Time Tracker">
  <!--
    Favicon, and the mark shown beside the title in the header (item 23).

    Lives in public/ so Vite copies it verbatim and prefixes the base path, giving
    https://air-ltd.github.io/personal-time-tracker/favicon.svg.

    Declaring it in index.html also stops the browser's implicit request to
    /favicon.ico at the origin root, which for a project site is outside the
    repository path and always 404s.

    Drawn on the same 32-unit grid as the in-app icons, with the same rounded line
    caps, so the header mark and the favicon are recognisably one set. The clock is
    heavier than a UI stroke on purpose: it is the one icon that has to survive being
    rendered at 16px in a browser tab, where a 2-unit stroke on a 32 grid would be
    all but invisible.
  -->
  <rect width="32" height="32" rx="7" fill="#1f5fbf" />
  <circle cx="16" cy="16.5" r="9" fill="none" stroke="#ffffff" stroke-width="3" />
  <!--
    Hands: the hour hand shorter and the minute hand longer, so the two are
    distinguishable at 16px rather than reading as a single stub.
  -->
  <path
    d="M16 16.5V10.8"
    fill="none"
    stroke="#ffffff"
    stroke-width="3"
    stroke-linecap="round"
  />
  <path
    d="M16 16.5l4.6 2.9"
    fill="none"
    stroke="#ffffff"
    stroke-width="3"
    stroke-linecap="round"
  />
</svg>
