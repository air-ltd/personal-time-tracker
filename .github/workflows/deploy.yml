name: Deploy

# 0009 CI1: every push and pull request runs typecheck, lint, test and a production
# build. CI2: deploy runs only from the default branch, after those checks pass.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Grants read-only contents permission by default; Pages deployment needs more,
# so scope it to the deploy job only.
permissions:
  contents: read

concurrency:
  # One deploy at a time. A superseded Pages deployment failing is noise.
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Must match the devcontainer's Node 24 feature and package.json engines.
          node-version-file: '.nvmrc'
          # 0009 CI3: install from the committed lockfile, so CI builds what was
          # tested rather than whatever the registry serves today.
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # Both are cheap, deterministic, and catch a class of defect no test asserts:
      # a secret that would ship in the bundle, and a requirement citation that has
      # stopped resolving. `check:silent` is deliberately absent — it re-introduces
      # bugs on purpose and re-runs the suite once per mutation, so it belongs on a
      # schedule rather than on every push.
      - name: Check for bundled secrets
        run: npm run check:secrets

      - name: Check requirement citations
        run: npm run check:citations

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest
    # Non-blocking on purpose. A real browser catches failures jsdom cannot, notably
    # a wrong base path producing a blank page behind a green build — which is
    # exactly how Phase 1 failed. Kept non-blocking so a browser download or flake
    # cannot block a deploy; revisit once it proves stable on CI.
    continue-on-error: true
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Smoke test
        run: npm run test:e2e

  deploy:
    name: Deploy to GitHub Pages
    # 0009 CI2: deploy only from the default branch, and only after verify passes.
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
